<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="user-info">
                <div class="avatar-container">
                    <img id="user-avatar" src="https://via.placeholder.com/50" alt="Avatar">
                </div>
                <div class="bot-details">
                    <h1 id="bot-name">My Bot</h1>
                    <p id="welcome-text">Привет, <span id="user-name">Гость</span></p>
                </div>
            </div>
        </header>

        <main class="content">
            <div class="search-container">
                <input type="text" id="webhook-input" placeholder="Введите ваш запрос...">
                <button id="send-button">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </div>

            <div class="output-container">
                <div id="output-header">Ответ:</div>
                <div id="output-window" class="empty">Ожидание запроса...</div>
            </div>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
